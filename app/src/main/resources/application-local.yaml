spring:
  application:
    name: phantastic-app
  datasource:
    hikari:
      jdbc-url: jdbc:h2:~/university
      username: sa
      password:
      driver-class-name: org.h2.driver
  flyway:
    enabled: true
  sql:
    init:
      mode: always

h2:
  console:
    enabled: true
    path: /h2-console